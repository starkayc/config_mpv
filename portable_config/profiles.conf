# ============================================================
# Streaming Profile (ytdl streams — buffered, no interpolation)
# ============================================================
[streaming]
profile-desc="ytdl streams - buffered, no interpolation"
profile-cond=path~=nil and string.match(path, "^ytdl://")~=nil
profile-restore=copy-equal
cache=yes
cache-secs=300
video-sync=audio
interpolation=no

[debrid]
profile-desc="Debrid stream (token-based or aiostreams link)"
profile-cond=(path~=nil and (string.match(path, "[?&]token=")~=nil or string.match(path, "aiostreams")~=nil)) or (filename~=nil and (string.match(filename, "[?&]token=")~=nil or string.match(filename, "aiostreams")~=nil))
profile-restore=copy-equal
profile=streaming
glsl-shaders="~~/shaders/ArtCNN_C4F16.glsl;~~/shaders/krigbl.glsl;~~/shaders/Adaptive-Sharpen.glsl"
save-position-on-quit=no

# ============================================================
# Anime Auto-Detection — applies shaders for common release groups
# ============================================================
[anime-web]
profile-desc="Anime WEB releases (SubsPlease, Erai-raws, etc.) — auto shaders"
profile-cond=filename~=nil and (string.match(filename, "[Ss]ubs[Pp]lease")~=nil or string.match(filename, "[Ee]rai")~=nil or string.match(filename, "[Nn]yan")~=nil or string.match(filename, "[Aa]sW")~=nil or string.match(filename, "[Pp]AS")~=nil or string.match(filename, "[Vv]ARYG")~=nil)
profile-restore=copy-equal
glsl-shaders="~~/shaders/ArtCNN_C4F16.glsl;~~/shaders/krigbl.glsl;~~/shaders/Adaptive-Sharpen.glsl"

# ============================================================
# Deband Profiles (toggle with keybind)
# ============================================================
[Deband-Medium]
deband-iterations=2
deband-threshold=64
deband-range=16
deband-grain=24

[Deband-Strong]
deband-iterations=3
deband-threshold=64
deband-range=16
deband-grain=24

# ============================================================
# 4K+ Downscaling — SSimDownscaler for perceptual quality
# ============================================================
[4k-downscaling]
profile-desc="4K+ content downscaling to 1440p"
profile-cond=(height >= 2160 or width >= 3840)
profile-restore=copy-equal
glsl-shaders-clr
glsl-shaders="~~/shaders/ssimds.glsl;~~/shaders/ssimsr.glsl"