### Profile ###
profile=high-quality

### Video Output ###
vo=gpu-next
gpu-api=vulkan
gpu-context=winvk
hwdec=auto-copy
hwdec-codecs=all
vd-lavc-dr=yes

### Scaling & Dithering ###
dither-depth=auto
temporal-dither=yes
dither=error-diffusion
error-diffusion=atkinson

### Interpolation ###
video-sync=audio
interpolation=no

### Debanding ###
deband=no
deband-iterations=2
deband-threshold=64
deband-range=16
deband-grain=12

### Tone Mapping (SDR) ###
tone-mapping=st2094-40
target-colorspace-hint=no

### Window & OSD ###
no-border
osc=no
snap-window
autofit=50%
cursor-autohide=500
osd-bar=no
osd-bold=yes
osd-font-size=37
osd-font='Inter'

### Playback ###
keep-open=no
save-position-on-quit=yes

### Audio ###
volume=100
volume-max=120
audio-file-auto=fuzzy
audio-exclusive=no
audio-channels=auto
audio-pitch-correction=yes
audio-normalize-downmix=yes

### Subtitles — Language Priority ###
slang=eng,en,enUS,English
alang=ja,jp,jpn,jap,Japanese,eng,en,enUS,English
demuxer-mkv-subtitle-preroll=yes
sub-auto=fuzzy
sub-fix-timing=yes
blend-subtitles=yes
sub-ass-override=no
sub-ass-style-overrides=playresx=1920,playresy=1080,Kerning=yes
sub-margin-x=100
sub-margin-y=50
sub-file-paths=sub;subs;subtitles

### Subtitles — Style (Carlito) ###
sub-font=Carlito
sub-font-size=52
sub-blur=0.1
sub-color="#FFFFFF"
sub-border-size=3.2
sub-border-color="#FF000000"
sub-shadow-color="#A0000000"
sub-shadow-offset=0.5
sub-bold=yes

### Screenshots ###
screenshot-dir="~~/cache/screenshots"
screenshot-template="%F-%p"
screenshot-format=webp
screenshot-webp-lossless=yes
screenshot-high-bit-depth=yes

### Paths, Cache & Logging ###
watch-later-dir="~~/cache/watch_later"
gpu-shader-cache-dir="~~/cache/shaders_cache"
log-file="~~/cache/logs/mpv.log"
msg-level=all=info
demuxer-max-bytes=150MiB
demuxer-readahead-secs=10
demuxer-max-back-bytes=75MiB

### Includes ###
include="~~/profiles.conf"
