# AutoClear — automatic cache cleanup for mpv
# Cleans old files from cache directories on startup or schedule
# Place this file in: script-opts/autoclear.conf

# Log level for AutoClear messages
#   debug = per-folder counts, before/after, start/stop messages
#   info  = deleted counts per folder + total summary (default)
#   warn  = only warnings
#   off   = silent
log_level=info

# Base directory for relative folder names
# Relative names in the folders option are resolved under this path
# Supports ~~-prefixed paths and absolute paths
base_dir=~~/cache/

# Folders to clean (comma-separated)
# Relative names are resolved under base_dir
# Also supports ~~/-prefixed paths and absolute paths
# Examples:
#   folders=shaders_cache,watch_later
#   folders=shaders_cache,watch_later,screenshots
#   folders=~~/cache/logs,C:\temp\mpv-cache
folders=shaders_cache,watch_later

# Delete files older than N days
days=7

# Delay before first cleanup (seconds after startup)
# Gives other scripts time to initialize first
delay=3

# Repeat cleanup every N seconds (0 = startup only)
# Useful for long-running mpv sessions (e.g. music playback)
# Note: cleanup is synchronous and may briefly block the script thread
interval=0

# Run cleanup when mpv quits
# Useful for clearing temp files on exit
clean_on_quit=no

# Files to trim by line count (comma-separated)
# Keeps only the most recent N lines, removes the rest
# Useful for append-only logs like memo-history.log that grow over time
# Resolved under base_dir (same as folders)
# Example: trim_files=logs/memo-history.log
trim_files=logs/memo-history.log

# Number of lines to keep when trimming files
trim_lines=25
